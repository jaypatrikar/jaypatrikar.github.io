<style>
  /*
    Deliberately single-theme: a white-and-pastel, hand-tied-bouquet look.
    Inverting this to a dark palette would undo the point of it, so the
    same soft palette is kept under prefers-color-scheme/data-theme rather
    than flipping to a dark ground.
  */
  :root, :root[data-theme="dark"], :root[data-theme="light"] {
    --bg: #f6efe3;
    --bg-raised: #fffbf3;
    --ink: #5c4a53;
    --ink-soft: #ad93a0;
    --line: #ecdfd0;
    --rome: #e0879e;
    --rome-soft: #fbeae2;
    --sea: #96b9a3;
    --sea-soft: #eef3e6;
    --gold: #d9b56e;
    --lavender: #c9b7db;
    --lemon: #eecb5e;
    --lemon-leaf: #a3c08a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  a { color: inherit; }
  button { font: inherit; }

  /* ---------- Gate ---------- */
  #gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse at 50% 0%, var(--rome-soft), var(--bg) 65%);
  }
  #gate-card {
    width: 100%;
    max-width: 320px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 28px 30px;
    box-shadow: 0 20px 50px -25px rgba(150, 100, 120, 0.28);
    text-align: center;
  }
  .route { position: relative; height: 34px; margin: 0 auto 20px; max-width: 220px; }
  .route svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .route .dashes { stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 3 5; fill: none; }
  .route .plane {
    fill: var(--ink); transform-box: fill-box; transform-origin: center;
    animation: fly 3.2s ease-in-out infinite;
  }
  @keyframes fly {
    0%   { transform: translate(0px, 0px) rotate(6deg); opacity: 0; }
    8%   { opacity: 1; }
    50%  { transform: translate(51px, -21px) rotate(6deg); opacity: 1; }
    92%  { opacity: 1; }
    100% { transform: translate(102px, 0px) rotate(6deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .route .plane { animation: none; transform: translate(51px, -21px) rotate(6deg); }
  }
  #gate form { display: flex; flex-direction: column; gap: 12px; }
  #gate p.label {
    text-transform: uppercase; letter-spacing: 0.14em; font-size: 11.5px;
    color: var(--rome); font-weight: 700; margin: 0 0 2px;
  }
  #gate h2 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 22px; margin: 0 0 16px; line-height: 1.25;
  }
  #gate input {
    font-size: 16px; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); text-align: center; letter-spacing: 0.04em;
  }
  #gate input:focus { outline: 2px solid var(--rome); outline-offset: 1px; }
  #gate button.submit {
    font-size: 15px; font-weight: 600; padding: 13px 14px; border-radius: 10px; border: none;
    background: var(--rome); color: #fff8f2; cursor: pointer;
  }
  #gate button.submit:active { transform: scale(0.98); }
  #gate button.submit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #gate .error { color: var(--rome); font-size: 13px; min-height: 16px; margin: 2px 0 0; }

  /* ---------- App shell ---------- */
  #content { display: none; }
  #view { animation: fadein 0.32s ease both; }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    #view { animation: none; }
  }

  .hero {
    position: relative; padding: 56px 20px 36px; text-align: center;
    background: linear-gradient(180deg, var(--rome-soft), transparent 75%);
    overflow: hidden;
  }
  .hero.compact { padding: 26px 20px 22px; }
  .hero .florals { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hero .inner { position: relative; z-index: 1; }
  .eyebrow {
    text-transform: uppercase; letter-spacing: 0.18em; font-size: 12px;
    color: var(--rome); font-weight: 700; margin: 0 0 12px;
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    font-size: 40px; line-height: 1.1; margin: 0 0 10px; text-wrap: balance; letter-spacing: -0.01em;
  }
  .subtitle { font-family: Georgia, "Palatino Linotype", serif; font-style: italic; color: var(--ink-soft); font-size: 17px; margin: 0 0 6px; }
  .dates { color: var(--ink-soft); font-size: 14px; font-variant-numeric: tabular-nums; letter-spacing: 0.03em; }
  .rule-flowers { width: 92px; height: auto; margin: 22px auto 0; display: block; }
  .map-link {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 18px;
    font-size: 13px; font-weight: 700; color: var(--rome); text-decoration: none;
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: 20px;
    padding: 8px 16px;
  }
  .map-link svg { width: 15px; height: 15px; }


  /* ---- Trip plan (Gantt) ---- built for a laptop screen, not a phone ---- */
  .plan-page { max-width: 1360px; margin: 0 auto; padding: 8px 20px 80px; }
  .plan-sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; }
  .plan-scroll { overflow-x: auto; padding-bottom: 6px; }
  .plan {
    min-width: 1150px;
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--bg-raised); overflow: hidden;
  }
  .plan-row { display: grid; grid-template-columns: 108px repeat(17, 1fr); align-items: stretch; }
  .plan-row + .plan-row { border-top: 1px solid var(--line); }

  .plan-head .plan-cell { padding: 8px 0 7px; text-align: center; }
  .plan-head .plan-lab { background: transparent; }
  .plan-dow {
    display: block; font-size: 9.5px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .plan-dom { display: block; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .plan-mon {
    display: block; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .plan-cell { border-left: 1px solid var(--line); min-height: 34px; position: relative; }
  .plan-cell.we { background: rgba(217,181,110,0.07); }

  .plan-lab {
    font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--ink-soft); padding: 11px 9px; display: flex; align-items: center;
    background: var(--bg); position: sticky; left: 0; z-index: 2;
  }

  /* a track holds absolutely positioned bars over a 17 column grid */
  .plan-track { position: relative; grid-column: 2 / -1; }
  .plan-grid {
    position: absolute; inset: 0; display: grid; grid-template-columns: repeat(17, 1fr);
    pointer-events: none;
  }
  .plan-grid i { border-left: 1px solid var(--line); }
  .plan-grid i.we { background: rgba(217,181,110,0.07); }
  .plan-bars {
    position: relative; display: grid; grid-template-columns: repeat(17, 1fr);
    gap: 5px 0; padding: 7px 0;
  }

  .bar {
    grid-row: 1; margin: 0 3px; border-radius: 8px; padding: 6px 9px;
    font-size: 12px; line-height: 1.25; color: var(--ink);
    border: 1px solid transparent; text-decoration: none; display: block;
    overflow: hidden;
  }
  /* single day bars get less room, so they wrap and shrink instead of clipping */
  .bar.narrow {
    padding: 5px 4px; font-size: 10.5px; line-height: 1.2; text-align: center;
    overflow-wrap: anywhere; margin: 0 2px;
  }
  .bar.narrow small { font-size: 9.5px; }
  .bar b { font-weight: 600; }
  .bar small { display: block; font-size: 10.5px; color: var(--ink-soft); margin-top: 1px; }
  a.bar:hover { filter: brightness(0.97); }

  .bar.stay-rome { background: var(--rome-soft); border-color: var(--rome); }
  .bar.stay-sea  { background: var(--sea-soft);  border-color: var(--sea); }
  .bar.fly {
    background: #fff; border-color: var(--gold); border-style: dashed;
    text-align: center; font-size: 11px;
  }
  .bar.booked { background: #f3ecf9; border-color: var(--lavender); }
  .bar.empty {
    background: transparent; border-color: var(--line); border-style: dashed;
    color: var(--ink-soft); text-align: center; font-size: 10px;
    letter-spacing: 0.06em; text-transform: lowercase;
    display: flex; align-items: center; justify-content: center; min-height: 28px;
  }
  a.bar.empty:hover { background: var(--bg); border-color: var(--ink-soft); }
  .bar.idea {
    background: repeating-linear-gradient(135deg, #fdf7e6, #fdf7e6 6px, #fbf1d8 6px, #fbf1d8 12px);
    border-color: var(--lemon); border-style: dashed;
  }

  .plan-legend {
    display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px;
    font-size: 12px; color: var(--ink-soft);
  }
  .plan-legend span { display: inline-flex; align-items: center; gap: 7px; }
  .plan-legend i {
    width: 16px; height: 11px; border-radius: 4px; display: inline-block;
    flex-shrink: 0; border: 1px solid var(--line);
  }
  .plan-note {
    margin-top: 18px; font-size: 12.5px; line-height: 1.6; color: var(--ink-soft);
    border-top: 1px solid var(--line); padding-top: 14px;
  }

  /* ---- Trip map ---- */
  .map-sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 14px; }
  #trip-map {
    height: 62vh; min-height: 340px; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--line); background: var(--bg-raised);
  }
  .map-popup { font-size: 13px; line-height: 1.5; }
  .map-popup strong { display: block; font-size: 13.5px; margin-bottom: 3px; }
  .map-popup a { display: block; color: var(--rome); font-weight: 600; text-decoration: none; margin-top: 4px; }
  .map-popup a:hover { text-decoration: underline; }
  .map-legend {
    display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 12px; color: var(--ink-soft);
  }
  .map-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .map-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  .page { max-width: 620px; margin: 0 auto; padding: 8px 16px 80px; }

  /* breadcrumb / back link */
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 600; color: var(--rome);
    text-decoration: none; padding: 6px 2px; margin-bottom: 4px;
  }
  .back svg { width: 15px; height: 15px; }
  .crumbs { font-size: 12.5px; color: var(--ink-soft); margin: 2px 0 18px; }
  .crumbs a { color: var(--ink-soft); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }

  /* ---- Overview: list of days ---- */
  .timeline { position: relative; display: flex; flex-direction: column; gap: 0; padding-top: 12px; }
  .timeline::before { content: ""; position: absolute; top: 8px; bottom: 8px; left: 5px; width: 1px; background: var(--line); }
  .leg { position: relative; padding: 0 0 6px 30px; }
  .leg::before {
    content: ""; position: absolute; left: 0; top: 7px; width: 11px; height: 11px;
    border-radius: 50%; background: var(--bg-raised); border: 2px solid var(--dot, var(--rome));
  }
  .leg.sea { --dot: var(--sea); }

  .day-link {
    display: block; text-decoration: none; color: inherit;
    background: var(--bg-raised); border: 1px solid var(--line); border-left: 3px solid var(--dot, var(--rome));
    border-radius: 4px 12px 12px 4px; padding: 15px 16px; margin-bottom: 24px;
  }
  .day-link:active { transform: scale(0.99); }
  .leg-when { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; margin-bottom: 4px; color: var(--dot, var(--rome)); }
  .leg-title {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 21px; margin: 0 0 6px; text-wrap: balance; line-height: 1.2;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .leg-title .lt-left { display: flex; align-items: center; gap: 8px; }
  .deco { width: 19px; height: 19px; flex-shrink: 0; display: inline-block; vertical-align: -3px; }
  .leg-title .chev { width: 16px; height: 16px; color: var(--ink-soft); flex-shrink: 0; }
  .leg-sub { font-size: 13.5px; color: var(--ink-soft); }
  .leg-sub .count { font-variant-numeric: tabular-nums; }

  /* ---- Day view: list of events ---- */
  .event-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .event-link {
    display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px;
  }
  .event-link:active { transform: scale(0.99); }
  .event-icon {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--dot-soft, var(--rome-soft)); color: var(--dot, var(--rome));
  }
  .event-icon svg { width: 17px; height: 17px; }
  .event-text { flex: 1; min-width: 0; }
  .event-title { font-weight: 600; font-size: 14.5px; }
  .event-meta { font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .event-link .chev { width: 15px; height: 15px; color: var(--ink-soft); flex-shrink: 0; }

  /* ---- Hour-by-hour schedule ---- */
  .sched-heading {
    margin: 18px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-soft); font-weight: 700;
  }
  .sched-sub { font-size: 12px; color: var(--ink-soft); margin: 0 0 12px; font-style: italic; }
  .sched-row { position: relative; display: flex; gap: 12px; padding: 0 0 16px 0; }
  .sched-row:last-child { padding-bottom: 0; }
  .sched-time {
    flex-shrink: 0; width: 46px; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--dot, var(--rome)); padding-top: 1px;
  }
  .sched-rail { flex-shrink: 0; width: 10px; display: flex; flex-direction: column; align-items: center; }
  .sched-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--rome)); margin-top: 4px; flex-shrink: 0; }
  .sched-line { flex: 1; width: 1px; background: var(--line); margin-top: 3px; }
  .sched-row:last-child .sched-line { display: none; }
  .sched-body { flex: 1; padding-bottom: 2px; }
  .sched-title { font-weight: 600; font-size: 14px; }
  .sched-link { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; color: var(--dot, var(--rome)); }
  .sched-link:hover { text-decoration: underline; }
  .sched-link svg { width: 12px; height: 12px; flex-shrink: 0; }
  .sched-note { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; line-height: 1.4; }

  .day-note {
    margin-top: 16px; padding: 12px 14px; border-radius: 10px;
    background: var(--sea-soft); color: var(--ink); font-size: 13.5px; font-style: italic;
    display: flex; gap: 8px; align-items: flex-start;
  }
  .warn {
    margin-top: 16px; padding: 13px 14px; border-radius: 10px;
    background: #fbe4d8; border: 1px solid #edb896; color: #7a3c1e; font-size: 13.5px;
    display: flex; gap: 8px; align-items: flex-start; line-height: 1.45;
  }
  .warn strong { display: block; margin-bottom: 2px; }

  /* ---- Ideas to explore (alternates, not booked) ---- */
  .ideas-heading {
    margin: 28px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-soft); font-weight: 700; display: flex; align-items: center; gap: 6px;
  }
  .ideas-sub { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 12px; }
  .idea-group { margin-bottom: 18px; }
  .idea-group-label {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dot, var(--rome));
    font-weight: 700; margin-bottom: 8px;
  }
  .idea-card {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px; margin-bottom: 8px;
  }
  .idea-main { flex: 1; min-width: 0; }
  .idea-title { font-weight: 600; font-size: 14px; }
  .idea-title a { text-decoration: none; color: var(--dot, var(--rome)); }
  .idea-title a:hover { text-decoration: underline; }
  .idea-note { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .pill {
    display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 2px 7px; border-radius: 20px; margin-top: 6px;
    background: #fbe4d8; color: #7a3c1e;
  }
  .idea-go { flex-shrink: 0; color: var(--ink-soft); }
  .idea-go svg { width: 15px; height: 15px; }

  /* ---- Event view: detail card ---- */
  .event-hero { display: flex; align-items: center; gap: 12px; margin: 6px 0 18px; }
  .event-hero .event-icon { width: 46px; height: 46px; }
  .event-hero .event-icon svg { width: 21px; height: 21px; }
  .event-hero h2 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 23px; margin: 0; line-height: 1.2; text-wrap: balance;
  }
  .event-hero .event-kicker { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dot, var(--rome)); font-weight: 700; margin-bottom: 3px; }

  .card {
    background: var(--bg-raised); border: 1px solid var(--line); border-left: 3px solid var(--dot, var(--rome));
    border-radius: 4px 12px 12px 4px; padding: 16px 17px; font-size: 14.5px; color: var(--ink-soft);
    display: flex; flex-direction: column; gap: 8px;
  }
  .card strong { color: var(--ink); font-weight: 600; }
  .card .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .code {
    font-variant-numeric: tabular-nums; background: var(--dot-soft, var(--rome-soft)); color: var(--dot, var(--rome));
    padding: 2px 8px; border-radius: 5px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.02em; display: inline-block;
  }
  .note { font-style: italic; color: var(--ink-soft); font-size: 13.5px; }
  .field-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 1px; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .btn {
    flex: 1 1 auto; min-width: 0; text-align: center; text-decoration: none; font-size: 13px; font-weight: 600;
    padding: 10px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px;
  }
  .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .btn:active { transform: scale(0.97); }

  .stub {
    margin-top: 18px; padding: 13px 14px; border: 1px dashed var(--line); border-radius: 10px;
    font-size: 13px; color: var(--ink-soft); font-style: italic;
  }

  footer {
    max-width: 620px; margin: 48px auto 0; padding: 20px 16px 40px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--ink-soft); text-align: center;
  }

  @media (max-width: 480px) {
    h1 { font-size: 30px; }
    .subtitle { font-size: 15px; }
    .leg-title { font-size: 19px; }
    .hero { padding: 44px 16px 30px; }
  }

/* ---- Deck: one screen per thing you are about to do. Phone first. ---- */
.deck-wrap { position: fixed; inset: 0; background: var(--bg, #fdfbf6); z-index: 60;
  display: flex; flex-direction: column; overscroll-behavior: none; }
.deck-stage { flex: 1; position: relative; overflow: hidden; }
.deck-slide { position: absolute; inset: 0; display: flex; flex-direction: column;
  justify-content: center; padding: 28px 24px 16px; gap: 14px;
  opacity: 0; pointer-events: none; transition: opacity .18s ease; }
.deck-slide.is-on { opacity: 1; pointer-events: auto; }
.deck-day { font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
  opacity: .55; font-weight: 600; }
.deck-time { font-size: clamp(44px, 17vw, 84px); line-height: .95; font-weight: 700;

        ideas: [

          { category: "Gelato", title: "Otaleg (Trastevere)", note: "Widely called the best pistachio in Rome. Sits right where you will be on Sep 1 after the Vatican, so easier to catch then than today.", link: "https://www.google.com/maps/search/?api=1&query=Otaleg+Trastevere+Rome", reservation: false },
          { category: "Gelato", title: "Gelateria del Teatro", note: "Near Piazza Navona, a natural stop on the Palazzo Spada leg. Fresh fruit churned in front of you.", link: "https://www.google.com/maps/search/?api=1&query=Gelateria+del+Teatro+Rome", reservation: false },
          { category: "Wine · hidden gem", title: "Il Goccetto", note: "Near Campo de' Fiori, five minutes off today's route. Frescoed 18th-century room, about 30 wines by the glass, and you can buy a bottle straight off the wall. The benchmark old-school Roman enoteca.", link: "https://www.google.com/maps/search/?api=1&query=Il+Goccetto+Rome", reservation: false },

          { category: "Food · pizza", title: "Alle Carrette", note: "Some of the best pizza in Rome for the price, outdoor seating, in Monti. Already the Aug 31 lunch spot — save for a repeat only if you loved it.", link: "https://www.google.com/maps/search/?api=1&query=Alle+Carrette+Monti+Rome", reservation: false },
          { category: "Food · local", title: "Angelino in Tor Margana", note: "Tucked in a quiet piazza between the Forum and Capitoline Hill — cacio e pepe and carbonara, feels like a find.", link: "https://www.google.com/maps/search/?api=1&query=Angelino+ai+Fori+Piazza+Tor+Margana+Rome", reservation: true },
          { category: "Wine · hidden gem", title: "Al Vino al Vino", note: "Small Monti wine bar with a serious, curated list. With the cooking class moved to Sep 1, this is the easiest answer for your last night in Rome.", link: "https://www.google.com/maps/search/?api=1&query=Al+Vino+al+Vino+Monti+Rome", reservation: false },
          { category: "Wine · hidden gem", title: "Ai Tre Scalini", note: "Laid-back Monti wine bar near the Colosseum, good for an easy glass and people-watching.", link: "https://www.google.com/maps/search/?api=1&query=Ai+Tre+Scalini+Monti+Rome", reservation: false },
          { category: "Sights", title: "Trevi → Pantheon → Piazza Navona → Spanish Steps", note: "Classic walking loop, do Trevi early morning before 9am to beat crowds (or see Aug 31 night, where it's already on the plan).", link: "https://www.romewise.com/rome-in-3-days.html", reservation: false },
          { category: "Sights · viewpoint", title: "Giardino degli Aranci (Aventine Hill)", note: "The 'Orange Garden' — a framed view over the city and St. Peter's dome, quiet and free. Right next to it: the Aventine Keyhole (Buco della Serratura), a tiny door with St. Peter's perfectly centered through the keyhole. Could swap in for or add to the Capitoline Hill stop.", link: "https://www.google.com/maps/search/?api=1&query=Giardino+degli+Aranci+Rome", reservation: false },
          { category: "Sights · viewpoint", title: "Gianicolo (Janiculum Hill)", note: "Rome's best sunset viewpoint that isn't overrun — locals go here, not just tourists. Bigger and more open than the Aventine keyhole view, worth it if you want an actual sunset moment rather than a 30-second photo stop.", link: "https://www.google.com/maps/search/?api=1&query=Gianicolo+Janiculum+Hill+Rome", reservation: false },
          { category: "Sights", title: "Quartiere Coppedè", note: "A small, strange, wonderful architectural pocket near Villa Borghese — Art Nouveau meets Baroque, built in the 1920s, centered on the Fountain of the Frogs. Off every standard itinerary, 10-15 min out of the way if you're already near Villa Borghese.", link: "https://www.google.com/maps/search/?api=1&query=Quartiere+Coppede+Rome", reservation: false },
          { category: "Food · market", title: "Testaccio Market", note: "Rome's actual food-lover neighborhood, a 15-20 min taxi/metro from Monti. Mordi e Vai for slow-cooked Roman panini, Casa Manco for 100-hour-dough pizza, Food Box for supplì and fried artichokes. Best late morning, cash helps at some stalls. A genuinely different lunch option from anything else on this trip if Angelino doesn't land.", link: "https://www.google.com/maps/search/?api=1&query=Mercato+Testaccio+Rome", reservation: false },
          { category: "Aperitivo · rooftop", title: "The Court at Palazzo Manfredi", note: "Rooftop with the Colosseum lit up at dusk basically in your lap — upscale, cocktails named after the ruins. The single best-reviewed 'wow' rooftop if you want to splurge on one sunset drink in Rome.", link: "https://www.google.com/maps/search/?api=1&query=The+Court+Palazzo+Manfredi+Rome", reservation: true }

        '<svg class="rule-flowers" viewBox="0 0 92 14"><use href="#bloom" x="46" y="7" fill="var(--rome)" transform="scale(0.75)" style="transform-origin:46px 7px"/><path d="M50 7h34M8 7h34" stroke="var(--gold)" stroke-width="1.2" stroke-dasharray="1.5 4" stroke-linecap="round"/></svg>' +
        '<a class="map-link" href="#/map"><svg viewBox="0 0 24 24"><use href="#icon-map"/><use href="#icon-map-dot"/></svg>Trip map</a>' +
        '<a class="map-link" href="#/plan" style="margin-left:10px">Plan at a glance</a>' +
        '<a class="map-link" href="#/deck" style="margin-left:10px">Deck</a>' +
      '</div></div>' +
      '<div class="page"><div class="timeline">' + rows + '</div></div>';
  }

  function viewDay(dayId) {
    var day = findDay(dayId);
    if (!day) return viewNotFound();

    var events = day.events.map(function (ev) {
      var dotSoft = day.theme === "sea" ? "var(--sea-soft)" : "var(--rome-soft)";
      var dot = day.theme === "sea" ? "var(--sea)" : "var(--rome)";
      return '<a class="event-link" href="#/day/' + day.id + '/event/' + ev.id + '" style="--dot:' + dot + ';--dot-soft:' + dotSoft + '">' +
        '<span class="event-icon"><svg viewBox="0 0 24 24"><use href="#' + eventIconId(ev.type) + '"/></svg></span>' +
        '<span class="event-text"><span class="event-title">' + esc(ev.title) + '</span><br><span class="event-meta">' + esc(ev.summary) + '</span></span>' +
        chevron() +
      '</a>';
    }).join("");

    var note = day.note ? '<div class="day-note">&#127811; ' + day.note + '</div>' : "";
    var schedule = renderSchedule(day);
    var ideas = renderIdeas(day);
    var eventsBlock = events ? '<div class="event-list">' + events + '</div>' : "";

    return '<div class="hero compact ' + (day.theme === "sea" ? "" : "") + '">' + heroFlorals() +
      '<div class="inner">' +
        '<a class="back" href="#/">' + backChevron() + ' All days</a>' +
        '<a class="back" href="#/map" style="float:right">' + esc("Map") + '</a>' +
        '<p class="eyebrow">' + esc(day.when) + '</p>' +
        '<h1 style="font-size:30px">' + decoIcon(day.deco, "deco") + ' ' + esc(day.title) + '</h1>' +
      '</div></div>' +
      '<div class="page">' +
        eventsBlock +
        note +
        schedule +
        ideas +
      '</div>';
  }

  /* Hour-by-hour plan for a day: day.schedule = [{time, title, note}] */
  function renderSchedule(day) {
    if (!day.schedule || !day.schedule.length) return "";
    var dot = day.theme === "sea" ? "var(--sea)" : "var(--rome)";
    var rows = day.schedule.map(function (block) {
      var titleHtml = block.link
        ? '<a href="' + block.link + '" target="_blank" rel="noopener" class="sched-link">' + esc(block.title) + ' <svg viewBox="0 0 24 24"><use href="#icon-external"/></svg></a>'
        : esc(block.title);
      return '<div class="sched-row">' +
        '<div class="sched-time">' + esc(block.time) + '</div>' +
        '<div class="sched-rail"><div class="sched-dot"></div><div class="sched-line"></div></div>' +
        '<div class="sched-body"><div class="sched-title">' + titleHtml + '</div>' +
        (block.note ? '<div class="sched-note">' + esc(block.note) + '</div>' : "") +
        '</div>' +
      '</div>';
    }).join("");
    return '<div class="sched-heading" style="color:' + dot + '">Today’s plan</div>' +
      '<p class="sched-sub">A draft, not locked in — swap anything.</p>' +
      '<div class="sched-list" style="--dot:' + dot + '">' + rows + '</div>';
  }

  /* Alternates worth exploring but not booked yet — grouped by category, each
     an outbound link so Suchita and Jay can browse before deciding together. */
  function renderIdeas(day) {
    if (!day.ideas || !day.ideas.length) return "";
    var dot = day.theme === "sea" ? "var(--sea)" : "var(--rome)";

    var groups = {};
    var order = [];
    day.ideas.forEach(function (idea) {
      if (!groups[idea.category]) { groups[idea.category] = []; order.push(idea.category); }
      groups[idea.category].push(idea);
    });

    var groupsHtml = order.map(function (cat) {
      var cards = groups[cat].map(function (idea) {
        var pill = idea.reservation ? '<span class="pill">Needs reservation</span>' : "";
        return '<div class="idea-card">' +
          '<div class="idea-main">' +
            '<div class="idea-title"><a href="' + idea.link + '" target="_blank" rel="noopener">' + esc(idea.title) + '</a></div>' +
            '<div class="idea-note">' + esc(idea.note) + '</div>' +
            pill +
          '</div>' +
          '<a class="idea-go" href="' + idea.link + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><use href="#icon-external"/></svg></a>' +
        '</div>';
      }).join("");
      return '<div class="idea-group"><div class="idea-group-label" style="color:' + dot + '">' + esc(cat) + '</div>' + cards + '</div>';
    }).join("");

    return '<div class="ideas-heading">' +
        '<svg style="width:14px;height:14px" viewBox="0 0 24 24"><use href="#bloom" x="12" y="12" fill="' + dot + '" transform="scale(0.5)" style="transform-origin:12px 12px"/></svg>' +
        'Ideas to explore' +
      '</div>' +
      '<p class="ideas-sub">Alternates, not booked yet — follow the links, decide together, we’ll lock it in later.</p>' +
      groupsHtml;
  }

  function viewEvent(dayId, eventId) {
    var day = findDay(dayId);
    var ev = findEvent(day, eventId);
    if (!day || !ev) return viewNotFound();

    var dot = day.theme === "sea" ? "var(--sea)" : "var(--rome)";
    var dotSoft = day.theme === "sea" ? "var(--sea-soft)" : "var(--rome-soft)";

    var detailRows = "";
    if (ev.detail) {
      Object.keys(ev.detail).forEach(function (k) {
        detailRows += '<div class="row"><span class="field-label" style="display:inline">' + esc(k) + '</span><strong>' + esc(ev.detail[k]) + '</strong></div>';
      });
    }

    var confirmation = ev.confirmation ? '<div class="row"><span>Confirmation</span><span class="code" style="--dot:' + dot + ';--dot-soft:' + dotSoft + '">' + esc(ev.confirmation) + '</span></div>' : "";

    var actions = "";
    if (ev.pdf || ev.mapQuery || ev.phone) {
      actions = '<div class="actions">';
      if (ev.pdf) actions += '<a class="btn" href="' + ev.pdf + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><use href="#icon-pdf"/></svg>Confirmation</a>';
      if (ev.mapQuery) actions += '<a class="btn" href="https://www.google.com/maps/search/?api=1&query=' + ev.mapQuery + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><use href="#icon-map"/><use href="#icon-map-dot"/></svg>Map</a>';
      if (ev.phone) actions += '<a class="btn" href="tel:' + ev.phone + '"><svg viewBox="0 0 24 24"><use href="#icon-phone"/></svg>' + esc(ev.host || "Call") + '</a>';
      actions += '</div>';
    }

    var stub = '<div class="stub">Transport to/from this ' + (ev.type === "stay" ? "stay" : "event") + ' isn’t recorded yet — space is ready here once it is.</div>';

    return '<div class="page" style="padding-top:20px">' +
      '<a class="back" href="#/day/' + day.id + '">' + backChevron() + ' ' + esc(day.title) + '</a>' +
      '<div class="crumbs"><a href="#/">All days</a> &rsaquo; <a href="#/day/' + day.id + '">' + esc(day.when) + '</a> &rsaquo; ' + esc(ev.title) + '</div>' +
      '<div class="event-hero" style="--dot:' + dot + ';--dot-soft:' + dotSoft + '">' +
        '<span class="event-icon"><svg viewBox="0 0 24 24"><use href="#' + eventIconId(ev.type) + '"/></svg></span>' +
        '<div><div class="event-kicker" style="--dot:' + dot + '">' + esc(ev.type) + '</div><h2>' + esc(ev.title) + '</h2></div>' +
      '</div>' +
      '<div class="card" style="--dot:' + dot + '">' +
        detailRows +
        confirmation +
        (ev.address ? '<span class="note">' + esc(ev.address) + '</span>' : "") +
        actions +
      '</div>' +
      stub +
    '</div>';
  }

  var TRIP_MAP_INSTANCE = null;

  function viewMap() {
    return '<div class="hero compact">' + heroFlorals() +
      '<div class="inner">' +
        '<a class="back" href="#/">' + backChevron() + ' All days</a>' +
        '<p class="eyebrow">Trip overview</p>' +
        '<h1 style="font-size:30px">The Route</h1>' +
      '</div></div>' +
      '<div class="page">' +
        '<p class="map-sub">Every stay, booked stop, and food/wine alternate. Zoom in on a city for the full detail — tap a pin for more.</p>' +
        '<div id="trip-map"></div>' +
        '<div class="map-legend">' +
          '<span><i style="background:var(--rome)"></i>Stay</span>' +
          '<span><i style="background:var(--gold)"></i>Booked sight</span>' +
          '<span><i style="background:var(--sea)"></i>Activity</span>' +
          '<span><i style="background:#cf9a6b"></i>Food</span>' +
          '<span><i style="background:var(--lavender)"></i>Wine</span>' +
          '<span><i style="background:var(--ink-soft)"></i>Flight / airport</span>' +
        '</div>' +
      '</div>';
  }

  var MAP_STYLE = [
    { elementType: "geometry", stylers: [{ color: "#f6efe3" }] },
    { elementType: "labels.text.stroke", stylers: [{ color: "#f6efe3" }] },
    { elementType: "labels.text.fill", stylers: [{ color: "#8a7a83" }] },
    { featureType: "administrative", elementType: "geometry", stylers: [{ color: "#ecdfd0" }] },
    { featureType: "poi", stylers: [{ visibility: "off" }] },
    { featureType: "road", elementType: "geometry", stylers: [{ color: "#fffbf3" }] },
    { featureType: "road", elementType: "labels", stylers: [{ visibility: "off" }] },
    { featureType: "transit", stylers: [{ visibility: "off" }] },
    { featureType: "water", elementType: "geometry", stylers: [{ color: "#cfe3df" }] }
  ];

  async function initTripMap() {
    var el = document.getElementById("trip-map");
    if (!el || !window.google || !google.maps || !google.maps.importLibrary) return;

    var mapsLib = await google.maps.importLibrary("maps");
    var Map = mapsLib.Map, InfoWindow = mapsLib.InfoWindow;

    TRIP_MAP_INSTANCE = new Map(el, {
      center: { lat: 41.5, lng: -10 },
      zoom: 3,
      gestureHandling: "cooperative",
      streetViewControl: false,
      mapTypeControl: false,
      fullscreenControl: false,
      styles: MAP_STYLE
    });
    var map = TRIP_MAP_INSTANCE;
    var infoWindow = new InfoWindow();

    var colorFor = { stay: "#e0879e", sight: "#d9b56e", activity: "#96b9a3", hub: "#ad93a0", food: "#cf9a6b", wine: "#c9b7db" };
    var bigTypes = { stay: 1, sight: 1, activity: 1, hub: 1 };
    var bounds = new google.maps.LatLngBounds();

    Object.keys(MAP_POINTS).forEach(function (id) {
      var pt = MAP_POINTS[id];
      var big = !!bigTypes[pt.type];
      var pos = { lat: pt.lat, lng: pt.lng };
      bounds.extend(pos);

      var marker = new google.maps.Marker({
        position: pos,
        map: map,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: pt.type === "hub" ? 6 : (big ? 9 : 6),
          fillColor: colorFor[pt.type] || "#e0879e",
          fillOpacity: big ? 0.95 : 0.85,
          strokeColor: "#fffbf3",
          strokeWeight: big ? 2 : 1.5
        }
      });

      var itineraryLink = pt.dayId ? ("#/day/" + pt.dayId + (pt.eventId ? "/event/" + pt.eventId : "")) : null;
      var mapsLink = pt.mapsQuery ? ("https://www.google.com/maps/search/?api=1&query=" + pt.mapsQuery) : null;
      var html = '<div class="map-popup"><strong>' + pt.label + "</strong>" +
        (itineraryLink ? '<a href="' + itineraryLink + '">Open in itinerary &rarr;</a>' : "") +
        (mapsLink ? '<a href="' + mapsLink + '" target="_blank" rel="noopener">Get directions &rarr;</a>' : "") +
        "</div>";

      marker.addListener("click", function () {
        infoWindow.setContent(html);
        infoWindow.open(map, marker);
      });
    });

    function dashedLine(a, b, color, scale, gap) {
      new google.maps.Polyline({
        path: [{ lat: a.lat, lng: a.lng }, { lat: b.lat, lng: b.lng }],
        map: map, geodesic: true, strokeOpacity: 0,
        icons: [{ icon: { path: "M 0,-1 0,1", strokeOpacity: 1, scale: scale, strokeColor: color }, offset: "0", repeat: gap }]
      });
    }

    MAP_SPINE.forEach(function (leg) {
      var a = MAP_POINTS[leg.from], b = MAP_POINTS[leg.to];
      if (leg.mode === "flight") {
        dashedLine(a, b, "#e0879e", 3, "10px");
      } else {
        new google.maps.Polyline({
          path: [{ lat: a.lat, lng: a.lng }, { lat: b.lat, lng: b.lng }],
          map: map, geodesic: true, strokeColor: "#e0879e", strokeOpacity: 0.7, strokeWeight: 2
        });
      }
    });

    MAP_SIDE_LINKS.forEach(function (pair) {
      dashedLine(MAP_POINTS[pair[0]], MAP_POINTS[pair[1]], "#96b9a3", 2, "8px");
    });

    map.fitBounds(bounds, 28);
  }

  function viewNotFound() {
    return '<div class="page" style="padding-top:40px;text-align:center">' +
      '<p>That page wandered off somewhere between Rome and Amalfi.</p>' +
      '<a class="back" href="#/" style="justify-content:center">' + backChevron() + ' Back to the itinerary</a>' +
    '</div>';
  }

  /* =========================================================
     TRIP PLAN  (whole trip on one screen, laptop sized)
  ========================================================= */

  /* Where we sleep. from is the arrival day, to is the departure day. */
  var STAYS = [
    { label: "Voorburg", sub: "Suchita's cousin", from: "2026-08-28", to: "2026-08-31", theme: "rome" },
    { label: "Rome", sub: "Giuseppe's, Monti", from: "2026-08-31", to: "2026-09-03", theme: "rome" },
    { label: "Praiano", sub: "Rosina's, Amalfi Coast", from: "2026-09-03", to: "2026-09-06", theme: "sea" },
    { label: "Voorburg", sub: "Suchita's cousin", from: "2026-09-06", to: "2026-09-13", theme: "rome" }
  ];

  /* Travel days, drawn as single day markers. */
  var LEGS = [
    { day: "2026-08-28", label: "PIT \u2192 AMS", title: "Pittsburgh to Detroit to Amsterdam" },
    { day: "2026-08-31", label: "AMS \u2192 FCO", title: "Amsterdam to Rome, KL1601 at 7:20 AM" },
    { day: "2026-09-03", label: "Rome \u2192 Praiano", title: "Rome to Praiano by train and bus" },
    { day: "2026-09-06", label: "NAP \u2192 AMS", title: "Praiano to Naples, then easyJet EJU4235 at 4:20 PM" },
    { day: "2026-09-13", label: "AMS \u2192 PIT", title: "Amsterdam to Detroit to Pittsburgh" }
  ];

  /* Confirmed bookings and the things still only planned. */
  var PLAN_BOOKED = [
    { day: "2026-08-31", label: "Colosseum", sub: "4:30 PM", title: "Arena Floor, Palatine and Forum guided tour, meet 4:15" },
    { day: "2026-09-01", label: "Vatican", sub: "2:15 PM", title: "Vatican guided tour" }
  ];
  var PLAN_IDEAS = [
    { day: "2026-09-04", label: "Lemon grove", sub: "not booked", title: "Amalfi Historical Garden lemon tour, still needs reserving" },
    { day: "2026-09-05", label: "Ravello", sub: "and Furore", title: "Villa Rufolo, Villa Cimbrone, Fiordo di Furore, SITA bus both ways" },
    { day: "2026-09-06", label: "Naples", sub: "half day", title: "Pizza and Spaccanapoli before the 4:20 PM flight" }
  ];

  /* Rome and Amalfi window. Fill a string in to turn a placeholder into a real bar. */
  var FOOD_DAYS = ["2026-08-31", "2026-09-01", "2026-09-02", "2026-09-03",
                   "2026-09-04", "2026-09-05", "2026-09-06"];
  var PLAN_LUNCH  = {
    "2026-08-31": "", "2026-09-01": "", "2026-09-02": "", "2026-09-03": "",
    "2026-09-04": "", "2026-09-05": "", "2026-09-06": ""
  };
  var PLAN_DINNER = {
    "2026-08-31": "", "2026-09-01": "", "2026-09-02": "", "2026-09-03": "",
    "2026-09-04": "", "2026-09-05": "", "2026-09-06": ""
  };
  /* Getting around within a day, as opposed to the big legs in LEGS. */
  var PLAN_LOCAL = {
    "2026-08-31": "", "2026-09-01": "", "2026-09-02": "", "2026-09-03": "",
    "2026-09-04": "", "2026-09-05": "", "2026-09-06": ""
  };

  function planSlotRow(map, placeholder) {
    return FOOD_DAYS.map(function (d) {
      var idx = planDayIndex();
      if (idx[d] === undefined) return null;
      var val = map[d];
      if (val) {
        return { start: idx[d], span: 1, cls: "booked", label: val, href: "#/day/" + d };
      }
      return { start: idx[d], span: 1, cls: "empty", label: placeholder, href: "#/day/" + d };
    }).filter(Boolean);
  }

  function planDayIndex() {
    var idx = {};
    TRIP.days.forEach(function (d, i) { idx[d.id] = i; });
    return idx;
  }

  function planIsWeekend(dayId) {
    var dt = new Date(dayId + "T12:00:00");
    var n = dt.getDay();
    return n === 0 || n === 6;
  }

  function planGridCells() {
    return TRIP.days.map(function (d) {
      return '<i class="' + (planIsWeekend(d.id) ? "we" : "") + '"></i>';
    }).join("");
  }

  /* One horizontal track. items already carry start/span. */
  function planTrack(items) {
    var bars = items.map(function (it) {
      var style = "grid-column:" + (it.start + 1) + " / span " + it.span + ";";
      var cls = it.cls + (it.span === 1 ? " narrow" : "");
      var inner = "<b>" + esc(it.label) + "</b>" + (it.sub ? "<small>" + esc(it.sub) + "</small>" : "");
      var ttl = it.title ? ' title="' + esc(it.title) + '"' : "";
      if (it.href) {
        return '<a class="bar ' + cls + '" style="' + style + '"' + ttl + ' href="' + it.href + '">' + inner + "</a>";
      }
      return '<div class="bar ' + cls + '" style="' + style + '"' + ttl + ">" + inner + "</div>";
    }).join("");
    return '<div class="plan-track">' +
      '<div class="plan-grid">' + planGridCells() + "</div>" +
      '<div class="plan-bars">' + bars + "</div>" +
    "</div>";
  }

  function viewPlan() {
    var idx = planDayIndex();

    var headCells = TRIP.days.map(function (d) {
      var dt = new Date(d.id + "T12:00:00");
      var dow = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][dt.getDay()];
      var mon = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][dt.getMonth()];
      return '<a class="plan-cell ' + (planIsWeekend(d.id) ? "we" : "") + '" href="#/day/' + d.id + '" ' +
        'style="text-decoration:none">' +
        '<span class="plan-dow">' + dow + "</span>" +
        '<span class="plan-dom">' + dt.getDate() + "</span>" +
        '<span class="plan-mon">' + mon + "</span>" +
      "</a>";
    }).join("");

    var stays = STAYS.map(function (s) {
      var a = idx[s.from], b = idx[s.to];
      if (a === undefined || b === undefined) return null;
      var span = Math.max(1, b - a);
      var nights = span;
      return {
        start: a, span: span, cls: "stay-" + s.theme,
        label: s.label, sub: s.sub + " · " + nights + (nights === 1 ? " night" : " nights"),
        href: "#/day/" + s.from
      };
    }).filter(Boolean);

    var legs = LEGS.map(function (l) {
      if (idx[l.day] === undefined) return null;
      return { start: idx[l.day], span: 1, cls: "fly", label: l.label, title: l.title, href: "#/day/" + l.day };
    }).filter(Boolean);

    var booked = PLAN_BOOKED.map(function (b) {
      if (idx[b.day] === undefined) return null;
      return { start: idx[b.day], span: 1, cls: "booked", label: b.label, sub: b.sub, title: b.title, href: "#/day/" + b.day };
    }).filter(Boolean);

    var ideas = PLAN_IDEAS.map(function (b) {
      if (idx[b.day] === undefined) return null;

    }).filter(Boolean);

    var lunch  = planSlotRow(PLAN_LUNCH, "lunch");
    var dinner = planSlotRow(PLAN_DINNER, "dinner");
    var local  = planSlotRow(PLAN_LOCAL, "travel");

    return '<div class="hero compact">' + heroFlorals() +
      '<div class="inner">' +
        '<a class="back" href="#/">' + backChevron() + " All days</a>" +
        '<a class="back" href="#/map" style="float:right">Map</a>' +
        '<p class="eyebrow">The whole trip</p>' +
        '<h1 style="font-size:30px">Plan at a glance</h1>' +
      "</div></div>" +
      '<div class="plan-page">' +
        '<p class="plan-sub">Seventeen days, Aug 28 to Sep 13. Click any bar or date to open that day.</p>' +
        '<div class="plan-scroll"><div class="plan">' +
          '<div class="plan-row plan-head"><div class="plan-lab"></div>' + headCells + "</div>" +
          '<div class="plan-row"><div class="plan-lab">Where</div>' + planTrack(stays) + "</div>" +
          '<div class="plan-row"><div class="plan-lab">Travel</div>' + planTrack(legs) + "</div>" +
          '<div class="plan-row"><div class="plan-lab">Getting around</div>' + planTrack(local) + "</div>" +
          '<div class="plan-row"><div class="plan-lab">Lunch</div>' + planTrack(lunch) + "</div>" +
          '<div class="plan-row"><div class="plan-lab">Dinner</div>' + planTrack(dinner) + "</div>" +
          '<div class="plan-row"><div class="plan-lab">Booked</div>' + planTrack(booked) + "</div>" +
          '<div class="plan-row"><div class="plan-lab">Planned</div>' + planTrack(ideas) + "</div>" +
        "</div></div>" +
        '<div class="plan-legend">' +
          '<span><i style="background:var(--rome-soft);border-color:var(--rome)"></i>Netherlands and Rome</span>' +
          '<span><i style="background:var(--sea-soft);border-color:var(--sea)"></i>Amalfi Coast</span>' +
          '<span><i style="background:#fff;border-color:var(--gold);border-style:dashed"></i>Travel day</span>' +
          '<span><i style="background:#f3ecf9;border-color:var(--lavender)"></i>Booked and paid</span>' +
          '<span><i style="background:#fdf7e6;border-color:var(--lemon);border-style:dashed"></i>Planned, not booked</span>' +
          '<span><i style="background:transparent;border-color:var(--line);border-style:dashed"></i>Empty, still to decide</span>' +
        "</div>" +
        '<p class="plan-note">Bars in the Where row span from arrival to departure, so the day you change cities shows under both. ' +
        'Anything in the Planned row still needs someone to actually book it. ' +
        'The dashed empty slots cover Rome and the Amalfi Coast, Aug 31 to Sep 6, and are there to be filled in.</p>' +
      "</div>";
  }

  /* =========================================================
     ROUTER
  ========================================================= */

  /* ---------- Deck ----------
     One slide per thing you are actually about to do, in order, across the whole
     trip. Day cards act as chapter breaks. Built from the same TRIP object as
     everything else, so a new schedule row becomes a new slide for free.
     Opens on the next upcoming item, which is the point of it on the trip. */

  function buildSlides() {
    var out = [];
    (TRIP.days || []).forEach(function (day) {
      var dot = day.theme === "sea" ? "var(--sea)" : "var(--rome)";
      out.push({
        kind: "chapter", dayId: day.id, when: day.when, title: day.title,
        note: day.note || "", color: dot, at: dayStart(day.id)
      });
      (day.schedule || []).forEach(function (b) {
        out.push({
          kind: "row", dayId: day.id, when: day.when, time: b.time, title: b.title,
          note: b.note || "", link: b.link || "", color: dot, at: rowTime(day.id, b.time)
        });
      });
    });
    return out;
  }

  function dayStart(id) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(id || "");
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3], 0, 0, 0);
  }

  /* Times in TRIP are mostly "HH:MM", a few are "H:MM AM". Anything we cannot
     parse just sorts to the start of its day, which is harmless. */
  function rowTime(id, t) {
    var base = dayStart(id);
    if (!base || !t) return base;
    var m = /(\d{1,2}):(\d{2})\s*(AM|PM)?/i.exec(t);
    if (!m) return base;
    var h = +m[1], min = +m[2], ap = (m[3] || "").toUpperCase();
    if (ap === "PM" && h < 12) h += 12;
    if (ap === "AM" && h === 12) h = 0;
    return new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, min, 0);
  }

  /* Index of the first slide at or after now. Before the trip that is 0, after
     it that is the last slide. Uses the device clock, so it is already correct
     once they land in Italy. */
  function nowIndex(slides) {
    var now = new Date();
    for (var i = 0; i < slides.length; i++) {
      if (slides[i].at && slides[i].at >= now) return i;
    }
    return slides.length ? slides.length - 1 : 0;
  }

  var DECK = { slides: [], i: 0 };

  function deckSlideHtml(s, isNow) {
    if (s.kind === "chapter") {
      return '<div class="deck-slide deck-chapter" style="color:' + s.color + '">' +
        '<div class="deck-rule"></div>' +
        '<div class="deck-time">' + s.title + '</div>' +
        '<div class="deck-day">' + esc(s.when) + '</div>' +
        (s.note ? '<div class="deck-sub">' + esc(s.note) + '</div>' : "") +
      '</div>';
    }
    return '<div class="deck-slide" style="color:' + s.color + '">' +
      (isNow ? '<div class="deck-now"><span>next up</span></div>' : "") +
      '<div class="deck-day">' + esc(s.when) + '</div>' +
      '<div class="deck-time">' + esc(s.time || "") + '</div>' +
      '<div class="deck-title">' + esc(s.title) + '</div>' +
      (s.note ? '<div class="deck-note">' + esc(s.note) + '</div>' : "") +
      (s.link ? '<a class="deck-go" href="' + s.link + '" target="_blank" rel="noopener">Open</a>' : "") +
    '</div>';
  }

  function viewDeck(startAt) {
    DECK.slides = buildSlides();
    var auto = nowIndex(DECK.slides);
    var i = (startAt === undefined || startAt === null) ? auto : startAt;
    if (i < 0) i = 0;
    if (i > DECK.slides.length - 1) i = DECK.slides.length - 1;
    DECK.i = i;
    DECK.auto = auto;

    var slides = DECK.slides.map(function (s, n) {
      return deckSlideHtml(s, n === auto);
    }).join("");

    return '<div class="deck-wrap" id="deck">' +
      '<div class="deck-stage" id="deck-stage">' + slides + '</div>' +
      '<div class="deck-bar">' +
        '<button id="deck-prev" aria-label="Previous">&#8592;</button>' +
        '<button id="deck-next" aria-label="Next">&#8594;</button>' +
        '<div class="deck-count" id="deck-count"></div>' +
        '<a class="deck-exit" id="deck-day-link" href="#/">Day</a>' +
        '<a class="deck-exit" href="#/">Close</a>' +
      '</div>' +
    '</div>';
  }

  function deckShow(n) {
    var stage = document.getElementById("deck-stage");
    if (!stage) return;
    var els = stage.querySelectorAll(".deck-slide");
    if (!els.length) return;
    if (n < 0) n = 0;
    if (n > els.length - 1) n = els.length - 1;
    DECK.i = n;
    for (var k = 0; k < els.length; k++) els[k].classList.toggle("is-on", k === n);
    var c = document.getElementById("deck-count");
    if (c) c.textContent = (n + 1) + " / " + els.length;
    var prev = document.getElementById("deck-prev");
    var next = document.getElementById("deck-next");
    if (prev) prev.disabled = n === 0;
    if (next) next.disabled = n === els.length - 1;
    var link = document.getElementById("deck-day-link");
    if (link && DECK.slides[n]) link.href = "#/day/" + DECK.slides[n].dayId;
  }

  function initDeck() {
    deckShow(DECK.i);
    var stage = document.getElementById("deck-stage");
    var prev = document.getElementById("deck-prev");
    var next = document.getElementById("deck-next");
    if (prev) prev.onclick = function () { deckShow(DECK.i - 1); };
    if (next) next.onclick = function () { deckShow(DECK.i + 1); };

    document.onkeydown = function (e) {
      if (!document.getElementById("deck")) return;
      if (e.key === "ArrowRight" || e.key === " ") { deckShow(DECK.i + 1); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { deckShow(DECK.i - 1); e.preventDefault(); }
      else if (e.key === "Escape") { location.hash = "#/"; }
    };

    /* Swipe. Ignore mostly-vertical drags so scrolling a long note still works. */
    var x0 = null, y0 = null;
    if (stage) {
      stage.addEventListener("touchstart", function (e) {
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      }, { passive: true });
      stage.addEventListener("touchend", function (e) {
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0;
        var dy = e.changedTouches[0].clientY - y0;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
          deckShow(DECK.i + (dx < 0 ? 1 : -1));
        }
        x0 = null; y0 = null;
      }, { passive: true });
    }
  }

  function route() {
    var hash = location.hash.replace(/^#\/?/, "");
    var parts = hash.split("/").filter(Boolean);
    var view = document.getElementById("view");
    if (!view) return;

    var html;
    if (parts[0] === "day" && parts[1] && parts[2] === "event" && parts[3]) {
      html = viewEvent(decodeURIComponent(parts[1]), decodeURIComponent(parts[3]));
    } else if (parts[0] === "day" && parts[1]) {
      html = viewDay(decodeURIComponent(parts[1]));
    } else if (parts[0] === "map") {
      html = viewMap();
    } else if (parts[0] === "plan") {
      html = viewPlan();
    } else if (parts[0] === "deck") {
      html = viewDeck(parts[1] === undefined ? null : parseInt(parts[1], 10));
    } else {
      html = viewOverview();
    }

    view.innerHTML = html;
    // restart the fade-in animation on every navigation
    view.style.animation = "none";
    void view.offsetWidth;
    view.style.animation = "";
    window.scrollTo(0, 0);

    if (parts[0] === "map") setTimeout(initTripMap, 0);
    if (parts[0] === "deck") setTimeout(initDeck, 0);
  }

  window.addEventListener("hashchange", route);
})();
</script>

</body>
</html>
